<!doctype html>
<html lang="en">

<head>
  {{ partial "analytics.html" . }}
  {{ partial "head.html" . }}
</head>

<body>
  {{ partial "header.html" . }}
  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}

    <span class="to-top-arrow" aria-hidden="true"></span>
  </button>
  <script src="{{ `js/to-top.js` | relURL }}" defer></script>
</body>

</html>

name: Build & deploy site

# Publishes this Hugo site to GitHub Pages (vfmod.com).
#
# One-time setup: repository → Settings → Pages → "Build and deployment" →
# Source: "GitHub Actions", and set the custom domain to vfmod.com.
#
# Each module's manual + panel images live in a module repo — the Forge Series
# ones share the ForgeSeries monorepo, older modules have their own. The build
# runs sync_manuals.py, which reads data/modules.yml (the only list of modules),
# clones what it names into modules/ and copies each manual + images into the
# site, so the published manuals always match those repos' default branch.

on:
  push:
    branches: [main]
  # Let module repos trigger a rebuild via repository_dispatch (optional).
  repository_dispatch:
    types: [module-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.164.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo
        run: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin hugo

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Clones every repo named by data/modules.yml (shallow + sparse) and
      # copies the manuals, images and panels into the site.
      - name: Fetch and sync module manuals
        run: python3 sync_manuals.py

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        # Use the canonical baseURL from hugo.toml (https://vfmod.com/). Don't
        # override with steps.pages.outputs.base_url — on this custom-domain
        # setup it resolves to https://vfmod.com/VFM-Website, which prefixes
        # every relURL asset with a 404-ing /VFM-Website/ path.
        run: hugo --gc --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

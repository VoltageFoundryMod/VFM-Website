# ── Module catalog ───────────────────────────────────────────────────────────
# Single source of truth for the module catalog. This file drives BOTH:
#   * the rendered cards / pages on the site, and
#   * _sync_manuals.rb, which copies each module's manual + images into the site
#     at build time (from the `manual_src` / `images_src` paths below).
#
# To add a module: add its submodule under ../modules, add a block here, done.
#
# Fields
#   slug        URL + asset key. Page lives at /modules/<slug>/.
#   name        Display name.
#   tagline     One-line pitch shown on the card and page header.
#   series      Product line label (e.g. "Forge Series"), or ~ for none.
#   hp          Panel width, shown as a spec chip. Optional.
#   repo        GitHub repo name under the VoltageFoundryMod org.
#   manual_src  Path (from repo root) to the module's manual markdown.
#   images_src  Path to the manual's image folder, or ~ if it has none. The
#               folder name is preserved, so the manual's relative image links
#               keep working (./images/x.png and ./Images/x.png are different
#               URLs on the Pages server).
#   panel_src   Path to the image used on the catalog card.
#   tags        VCV Rack tags.
#   modulargrid ModularGrid page, or ~ if not listed yet.
#   vcv         Optional, defaults to true. false = hardware only, no VCV Rack
#               version (analog module with nothing to emulate). Such a module
#               is still a submodule here for its manual, but is left out of
#               VFM_MODULES in the Makefile and of plugin.json.
#   draft       Optional. true = hide from the site and skip in the sync/CI
#               (e.g. while the module's repo is still private).


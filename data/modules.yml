# ── Module catalog ───────────────────────────────────────────────────────────
# Single source of truth for the module catalog. This file drives BOTH:
#   * the rendered cards / pages on the site, and
#   * sync_manuals.py, which fetches each module's repo and copies its manual +
#     images into the site at build time.
#
# It is the *only* list of module sources: the Makefile and the CI workflow both
# just run sync_manuals.py, which reads `src` below. Adding a module is one
# block here — nothing else to update.
#
# Fields
#   slug        URL + asset key. Page lives at /modules/<slug>/.
#   name        Display name.
#   src         Where the module lives: "<repo>" or "<repo>/<path in it>", under
#               github.com/VoltageFoundryMod. The Forge Series modules share the
#               ForgeSeries monorepo (one app per apps/<key> directory); older
#               modules are each their own repo. Everything else is derived:
#
#                   <src>/Manual.md          the manual
#                   <src>/images/            its image folder
#                   <src>/images/Front.png   the catalog-card panel
#
#               Override any of those three with `manual` / `images` / `panel`
#               (paths relative to <src>) when a repo differs. `images: ~` means
#               the module has no image folder.
#
#   tagline     One-line pitch shown on the card and page header.
#   series      Product line label (e.g. "Forge Series"), or ~ for none.
#   hp          Panel width, shown as a spec chip. Optional.
#   tags        VCV Rack tags.
#   modulargrid ModularGrid page, or ~ if not listed yet.
#   vcv         Optional, defaults to true. false = hardware only, no VCV Rack
#               version (analog module with nothing to emulate).
#   draft       Optional. true = hide from the site and skip in the sync/CI
#               (e.g. while the module's repo is still private).
#
# Note on image folder names: the source folder name is preserved verbatim, so
# the manual's relative links keep working (./images/x.png and ./Images/x.png
# are different URLs on the case-sensitive Pages server).

- slug: clockforge
  name: Clock Forge
  tagline: Advanced clock generator and modulator with four flexible outputs.
  series: Forge Series
  hp: 6HP
  src: ForgeSeries/apps/clk
  modulargrid: https://modulargrid.net/e/other-unknown-clockforge-by-voltage-foundry-modular
  tags:
    - Clock generator
    - Clock modulator
    - Digital
    - Hardware clone
    - 6HP


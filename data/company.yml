# Edit this file to update the landing-page copy. No code changes needed.

name: Voltage Foundry Modular
short_name: VFM
lead: >-
  Voltage Foundry Modular designs and builds open-source Eurorack modules. Every
  one is real, buildable hardware, and the firmware-driven ones also ship as
  pixel-accurate VCV Rack plugins — the same firmware that runs on the metal
  runs inside Rack, so you can try them before you buy or build.

# The pitch shown as three feature blurbs on the home page.
pillars:
  - title: Hardware you can build
    icon: "&#9874;" # hammer & pick
    body: >-
      Every module is fully open hardware — schematics, panels and firmware are
      published so you can build, mod and calibrate your own.
  - title: Try it in VCV Rack
    icon: "&#9835;" # beamed note
    body: >-
      The VCV Rack plugins are not reimplementations. They run the actual
      module firmware with the OLED emulated pixel for pixel.
  - title: One plugin, one install
    icon: "&#9881;" # gear
    body: >-
      Every module with a Rack version is bundled into a single VCV plugin, kept
      in sync with each module's own repository. (Soon on VCV Library!)

author: Carlos Eduardo de Paula
